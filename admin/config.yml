    hint: '''자동''이면 종료 연월을 보고 진행 중/종료가 자동 판정됩니다'
- name: equipment
  label: 연구 장비
  label_singular: 장비
  icon: precision_manufacturing
  file: content/equipment.json
  identifier_field: name_ko
  summary: "{{name_ko}}"
  description: 목록 순서가 사이트 표시 순서입니다. 순서를 바꾸려면 목록에서 끌어서 옮기세요.
  fields:
  - label: 장비명(한국어)
    name: name_ko
    widget: string
  - label: 장비명(영어)
    name: name_en
    widget: string
    required: false
  - label: 설명(한국어)
    name: desc_ko
    widget: text
  - label: 설명(영어)
    name: desc_en
    widget: text
    required: false
  - label: 사진 (선택)
    name: image
    widget: image
    required: false
  thumbnail:
  - image
- divider: true
- name: members
  label: 구성원
  label_singular: 구성원
  icon: group
  file: content/members.json
  identifier_field: name_ko
  summary: "{{name_ko}} · {{role_ko}}"
  description: 목록 순서가 사이트 표시 순서입니다. 순서를 바꾸려면 목록에서 끌어서 옮기세요.
  fields:
  - label: 아바타 글자(사용 안 함)
    name: initial
    widget: hidden
  - label: 사진 (선택
    name: photo
    widget: image
    required: false
    hint: 없으면 아바타 글자 표시)
  - label: 이름(한국어)
    name: name_ko
    widget: string
  - label: 이름(영어)
    name: name_en
    widget: string
    required: false
  - label: 직책(한국어)
    name: role_ko
    widget: string
  - label: 직책(영어)
    name: role_en
    widget: string
    required: false
  - label: "비고(한국어, 예: 2025년 합류"
    name: note_ko
    widget: text
    required: false
    hint: 줄바꿈 가능)
  - label: 비고(영어)
    name: note_en
    widget: text
    required: false
  - label: 이메일 (선택)
    name: email
    widget: string
    required: false
  - label: LinkedIn 주소
    name: linkedin
    widget: string
    required: false
    hint: "예: https://www.linkedin.com/in/아이디"
  - label: LinkedIn 버튼 노출
    name: show_linkedin
    widget: boolean
    default: false
    required: false
  - label: CV 파일 (PDF 업로드)
    name: cv
    widget: file
    required: false
  - label: CV 버튼 노출
    name: show_cv
    widget: boolean
    default: false
    required: false
  thumbnail:
  - photo
- name: alumni
  label: 졸업생 진로
