# =====================================================================
# GeoFlow 관리자 페이지(Sveltia CMS) 설정 — v49
#  - 기록형 목록(논문·발표·수상·소식·일정·프로젝트·과제·장비·구성원·졸업생·기관)은
#    content/<이름>.json 파일 하나(배열)에 저장되고, 관리 화면에서는 항목별로 편집합니다.
#  - 페이지 고정 문구(홈·페이지 상단·소개·연구 분야·지도교수)는 data/*.json 단일 파일입니다.
#  - 업로드: 10MB 이하, 사진은 긴 변 2400px WebP로 자동 변환, 파일 이름 자동 정리.
# =====================================================================
backend:
  name: github
  repo: petro-jbnu/petro-jbnu.github.io
  branch: main
  base_url: "https://sveltia-cms-auth.gwanwoo7835.workers.dev"
site_url: "https://petro-jbnu.github.io"
app_title: GeoFlow 관리자
logo:
  src: /assets/img/lab-mark.png
media_folder: assets/img/uploads
public_folder: assets/img/uploads
media_libraries:
  default:
    config:
      max_file_size: 10485760
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2400
          height: 2400
editor:
  preview: false
collections:
- name: papers
  label: 논문
  label_singular: 논문
  icon: article
  file: content/papers.json
  identifier_field: title_ko
  summary: "{{year}} · {{title_ko}}"
  description: 사이트에는 연도 최신순으로 자동 정렬됩니다.
  fields:
  - label: SCI 구분
    name: sci
    widget: select
    options:
    - SCI
    - Non-SCI
    default: SCI
  - label: 분급 (비SCI는 비워두기)
    name: quartile
    widget: select
    options:
    - Q1
    - Q2
    - Q3
    - Q4
    required: false
  - label: 연도
    name: year
    widget: string
    pattern:
    - ^\d{4}$
    - "연도는 숫자 4자리로 입력하세요 (예: 2026)."
  - label: DOI
    name: doi
    widget: string
    required: false
    hint: "`10.`으로 시작하는 번호만 입력하세요. 예: 10.1016/j.jclepro.2026.147969 (https://doi.org/ 는 빼고)"
    pattern:
    - ^10\.\d{4,9}/\S+$
    - "DOI는 10.으로 시작해야 합니다 (https://doi.org/ 는 빼고 입력)."
  - label: 논문 제목(한국어)
    name: title_ko
    widget: string
    hint: 국문지 논문은 국문 제목, 영문지는 영문 제목을 그대로 입력
  - label: 논문 제목(영어)
    name: title_en
    widget: string
    required: false
  - label: "저자 (로마자, 예: G.W. Ju, Y.S. Lee)"
    name: authors
    widget: string
  - label: "저자(한국어, 예: 주관우, 이영수"
    name: authors_ko
    widget: string
    required: false
    hint: 비우면 로마자 표기가 표시됩니다)
  - label: 저널명(한국어)
    name: journal_ko
    widget: string
    hint: 국문지는 국문 학회지명, 영문지는 영문지명 그대로
  - label: 저널명(영어)
    name: journal_en
    widget: string
    required: false
  - label: 저널 링크 URL (선택)
    name: url
    widget: string
    required: false
    hint: 논문 원문/저널 페이지 주소
    type: url
  sortable_fields:
    fields:
    - year
    - title_ko
    default:
      field: year
      direction: descending
- name: presentations
  label: 학술 발표
  label_singular: 학술 발표
  icon: co_present
  file: content/presentations.json
  identifier_field: title_ko
  summary: "{{date}} · {{title_ko}}"
  description: 사이트에는 발표 시기 최신순으로 자동 정렬됩니다.
  fields:
  - label: 발표 시기
    name: date
    widget: datetime
    hint: 달력에서 아무 날짜나 고르면 연·월만 저장됩니다.
    type: date
    format: YYYY-MM
  - label: 발표 형식 (구두/포스터)
    name: format
    widget: select
    options:
    - label: 구두 (Oral)
      value: oral
    - label: 포스터 (Poster)
      value: poster
    required: false
    hint: 제목 끝에 (Oral Session) 등을 적지 마세요
  - label: 발표 제목(한국어)
    name: title_ko
    widget: string
    hint: 국내 학회 국문 발표는 국문 제목
  - label: 발표 제목(영어)
    name: title_en
    widget: string
    required: false
  - label: "저자 (로마자, 예: G.W. Ju, Y.S. Lee)"
    name: authors
    widget: string
  - label: "저자(한국어, 예: 주관우, 이영수"
    name: authors_ko
    widget: string
    required: false
    hint: 비우면 로마자 표기가 표시됩니다)
  - label: "학술대회명(한국어, 예: 한국자원공학회 춘계학술대회)"
    name: venue_ko
    widget: string
  - label: "학술대회명(영어, 예: KSMER Spring Conference)"
    name: venue_en
    widget: string
    required: false
  sortable_fields:
    fields:
    - date
    - title_ko
    default:
      field: date
      direction: descending
- name: awards
  label: 수상
  label_singular: 수상
  icon: emoji_events
  file: content/awards.json
  identifier_field: name_ko
  summary: "{{date}} · {{name_ko}} ({{recipient_ko}})"
  description: 사이트에는 수상 시기 최신순으로 자동 정렬됩니다.
  fields:
  - label: 수상 시기
    name: date
    widget: datetime
    hint: 달력에서 아무 날짜나 고르면 연·월만 저장됩니다.
    type: date
    format: YYYY-MM
  - label: "상 종류(한국어, 예: 우수상·우수논문발표상)"
    name: award_ko
    widget: string
    required: false
  - label: "상 종류(영어, 예: Excellent Award)"
    name: award_en
    widget: string
    required: false
  - label: "수상 내용(한국어, 예: 2026 BK 상반기 참여대학원생 성과평가)"
    name: name_ko
    widget: string
    hint: "[상 종류]는 위 칸에"
  - label: 수상 내용(영어)
    name: name_en
    widget: string
    required: false
  - label: "수상자 (로마자, 예: G.W. Ju)"
    name: recipient
    widget: string
  - label: "수상자(한국어, 예: 주관우"
    name: recipient_ko
    widget: string
    required: false
    hint: 비우면 로마자 표기가 표시됩니다)
  - label: 수여기관(한국어)
    name: org_ko
    widget: string
  - label: 수여기관(영어)
    name: org_en
    widget: string
    required: false
  sortable_fields:
    fields:
    - date
    - name_ko
    default:
      field: date
      direction: descending
- divider: true
- name: activities
  label: 연구실 소식
  label_singular: 소식
  icon: campaign
  file: content/activities.json
  identifier_field: title_ko
  summary: "{{date}} · {{title_ko}}"
  description: 날짜 최신순으로 표시되며, 홈에는 최신 3개가 나옵니다.
  fields:
  - label: 날짜
    name: date
    widget: datetime
    type: date
    format: YYYY-MM-DD
  - label: 분류
    name: category
    widget: select
    options:
    - 교육
    - 워크샵
    - 발표
    - 기타
    default: 기타
  - label: 제목(한국어)
    name: title_ko
    widget: string
  - label: 제목(영어)
    name: title_en
    widget: string
    required: false
  - label: 내용(한국어)
    name: body_ko
    widget: text
    hint: "굵게: `<strong>글자</strong>`, 줄바꿈은 Enter"
  - label: 내용(영어)
    name: body_en
    widget: text
    required: false
  - label: 홈 대표 사진 (선택
    name: thumb
    widget: image
    required: false
    hint: 비우면 아래 첫 사진, 사진이 없으면 로고)
  - label: 사진 (최대 3장, 상세 화면에 표시)
    name: images
    widget: list
    max: 3
    required: false
    summary: "{{fields.caption_ko}}"
    fields:
    - label: 사진
      name: image
      widget: image
    - label: 설명(한국어, 선택)
      name: caption_ko
      widget: string
      required: false
    - label: 설명(영어, 선택)
      name: caption_en
      widget: string
      required: false
  sortable_fields:
    fields:
    - date
    - title_ko
    default:
      field: date
      direction: descending
  thumbnail:
  - thumb
  - images.*.image
- name: schedule
  label: 연구실 일정
  label_singular: 일정
  icon: event
  file: content/schedule.json
  identifier_field: title_ko
  summary: "{{date}} · {{title_ko}}"
  description: 달력과 다가오는 일정에 자동 표시됩니다.
  fields:
  - label: 날짜
    name: date
    widget: datetime
    type: date
    format: YYYY-MM-DD
  - label: 일정명(한국어)
    name: title_ko
    widget: string
  - label: 일정명(영어)
    name: title_en
    widget: string
    required: false
  sortable_fields:
    fields:
    - date
    - title_ko
    default:
      field: date
      direction: descending
- divider: true
- name: projects
  label: 연구 프로젝트
  label_singular: 프로젝트
  icon: science
  file: content/projects.json
  identifier_field: title_ko
  summary: "{{title_ko}} · {{status}}"
  description: 목록 순서가 사이트 표시 순서입니다. 순서를 바꾸려면 목록에서 끌어서 옮기세요.
  fields:
  - label: "고유 ID (영문·하이픈, 주소에 사용. 예: co2-experiment)"
    name: id
    widget: string
    unique: true
    pattern:
    - ^[A-Za-z0-9-]+$
    - 영문, 숫자, 하이픈(-)만 쓸 수 있습니다.
    hint: "영문·숫자·하이픈만. 사이트 주소에 쓰이므로 만든 뒤에는 바꾸지 마세요. 예: co2-experiment"
  - label: 진행 여부
    name: status
    widget: select
    options:
    - 진행 예정
    - 진행 중
    - 종료
    default: 진행 중
  - label: 제목(한국어)
    name: title_ko
    widget: string
  - label: 제목(영어)
    name: title_en
    widget: string
    required: false
  - label: 키워드 (쉼표로 추가)
    name: keywords
    widget: list
    required: false
  - label: 요약 문장(한국어)
    name: lead_ko
    widget: text
  - label: 요약 문장(영어)
    name: lead_en
    widget: text
    required: false
  - label: 연구 배경(한국어)
    name: bg_ko
    widget: text
  - label: 연구 배경(영어)
    name: bg_en
    widget: text
    required: false
  - label: 연구 내용 (최대 4개)
    name: sections
    widget: list
    max: 4
    summary: "{{fields.title_ko}}"
    fields:
    - label: 소제목(한국어)
      name: title_ko
      widget: string
    - label: 소제목(영어)
      name: title_en
      widget: string
      required: false
    - label: 세부 항목
      name: bullets
      widget: list
      fields:
      - label: 내용(한국어)
        name: ko
        widget: string
      - label: 내용(영어)
        name: en
        widget: string
        required: false
  - label: 참고 자료 설명(한국어, 선택)
    name: results_ko
    widget: text
    required: false
    hint: 참고 자료 이미지가 있을 때만 표시
  - label: 참고 자료 설명(영어, 선택)
    name: results_en
    widget: text
    required: false
  - label: 참고 자료 이미지 (최대 4장, 하나도 없으면 상세 페이지에서 '참고 자료' 단락이 숨겨집니다)
    name: figures
    widget: list
    max: 4
    required: false
    summary: "{{fields.cap_ko}}"
    fields:
    - label: 이미지
      name: image
      widget: image
    - label: 설명(한국어)
      name: cap_ko
      widget: string
      required: false
    - label: 설명(영어)
      name: cap_en
      widget: string
      required: false
  - label: 목록 카드 표시 설정
    name: card
    widget: object
    fields:
    - label: 카드 이미지
      name: image
      widget: image
      required: false
    - label: 상단 분류 문구
      name: chip
      widget: string
      required: false
      hint: "예: EXPERIMENT · AI"
    - label: 카드 설명(한국어)
      name: desc_ko
      widget: text
      required: false
    - label: 카드 설명(영어)
      name: desc_en
      widget: text
      required: false
    - label: 하단 태그
      name: tag
      widget: string
      required: false
      hint: "예: Machine Learning"
  thumbnail:
  - card.image
- name: grants
  label: 연구 과제
  label_singular: 과제
  icon: account_balance
  file: content/grants.json
  identifier_field: title_ko
  summary: "{{start_year}}.{{start_month}} · {{title_ko}}"
