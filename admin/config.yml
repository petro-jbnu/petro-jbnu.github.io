# =====================================================================
# 관리자 페이지(CMS) 설정 — SETUP-GUIDE.md 2단계에서 아래 3곳만 수정하세요.
#   (1) repo:      GitHub아이디/저장소이름
#   (2) base_url:  인증 워커 주소 (Cloudflare Worker)
#   (3) site_url:  배포된 사이트 주소
# =====================================================================
backend:
  name: github
  repo: petro-jbnu/petro-jbnu.github.io   # (1) 설정 완료
  branch: main
  base_url: https://sveltia-cms-auth.gwanwoo7835.workers.dev   # (2) 설정 완료

site_url: https://petro-jbnu.github.io   # (3) 설정 완료

media_folder: "assets/img/uploads"
public_folder: "assets/img/uploads"

collections:
  - name: "content"
    label: "사이트 콘텐츠"
    files:
      # ---------------- Home ----------------
      - name: "home"
        label: "홈 화면 (메인)"
        file: "data/home.json"
        fields:
          - { label: "메모", name: "_comment", widget: "hidden", required: false }
          - { label: "히어로 상단 소속 표기 (한국어)", name: "dept_ko", widget: "string", required: false }
          - { label: "히어로 상단 소속 표기 (영어, 대문자 권장)", name: "dept_en", widget: "string", required: false }
          - label: "히어로 슬라이드 (이미지 + 문구, 3장 권장)"
            name: "hero"
            widget: "list"
            max: 3
            summary: "{{fields.title_ko}}"
            fields:
              - { label: "배경 이미지", name: "image", widget: "image" }
              - { label: "큰 제목(한국어)", name: "title_ko", widget: "string", required: false }
              - { label: "큰 제목(영어)", name: "title_en", widget: "string", required: false }
              - { label: "설명 문구(한국어)  ※ 굵게: <strong>글자</strong>, 줄바꿈은 Enter", name: "body_ko", widget: "text", required: false }
              - { label: "설명 문구(영어)", name: "body_en", widget: "text", required: false }
          - label: "모집 배너 (히어로 바로 아래 띠)"
            name: "recruit"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - { label: "홈 화면에 표시", name: "show", widget: "boolean", default: true, required: false }
              - { label: "배지 문구(한국어)", name: "badge_ko", widget: "string", required: false }
              - { label: "배지 문구(영어)", name: "badge_en", widget: "string", required: false }
              - { label: "안내 문구(한국어)  ※ 굵게: <strong>글자</strong>", name: "text_ko", widget: "text", required: false }
              - { label: "안내 문구(영어)", name: "text_en", widget: "text", required: false }
              - { label: "링크 문구(한국어)  ※ 이동 주소는 문의 페이지로 고정", name: "link_ko", widget: "string", required: false }
              - { label: "링크 문구(영어)", name: "link_en", widget: "string", required: false }
          - label: "연구 카드 (최대 4장, 이동 주소는 프로젝트 페이지로 고정)"
            name: "cards"
            widget: "list"
            max: 4
            required: false
            summary: "{{fields.title_ko}}"
            fields:
              - { label: "카드 제목(한국어)", name: "title_ko", widget: "string" }
              - { label: "카드 제목(영어)", name: "title_en", widget: "string", required: false }
              - { label: "카드 설명(한국어)  ※ 굵게: <strong>글자</strong>", name: "desc_ko", widget: "text", required: false }
              - { label: "카드 설명(영어)", name: "desc_en", widget: "text", required: false }
          - label: "하단 지원 안내 배너"
            name: "cta"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - { label: "홈 화면에 표시", name: "show", widget: "boolean", default: true, required: false }
              - { label: "제목(한국어)", name: "title_ko", widget: "string", required: false }
              - { label: "제목(영어)", name: "title_en", widget: "string", required: false }
              - { label: "설명(한국어)  ※ 굵게: <strong>글자</strong>", name: "text_ko", widget: "text", required: false }
              - { label: "설명(영어)", name: "text_en", widget: "text", required: false }
              - { label: "버튼 문구(한국어)  ※ 이동 주소는 문의 페이지로 고정", name: "btn_ko", widget: "string", required: false }
              - { label: "버튼 문구(영어)", name: "btn_en", widget: "string", required: false }

      # ---------------- 각 페이지 상단 문구 ----------------
      - name: "pages"
        label: "각 페이지 상단 문구"
        file: "data/pages.json"
        fields:
          - { label: "메모", name: "_comment", widget: "hidden", required: false }
          - label: "소개 페이지"
            name: "about"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - { label: "큰 제목(한국어)", name: "title_ko", widget: "string", required: false }
              - { label: "큰 제목(영어)", name: "title_en", widget: "string", required: false }
              - { label: "소개 문구(한국어)  ※ 굵게: <strong>글자</strong>, 줄바꿈은 Enter", name: "lead_ko", widget: "text", required: false }
              - { label: "소개 문구(영어)", name: "lead_en", widget: "text", required: false }
              - { label: "이동 경로 표기(한국어)  예: Home / 구성원", name: "crumb_ko", widget: "string", required: false }
              - { label: "이동 경로 표기(영어)", name: "crumb_en", widget: "string", required: false }
          - label: "연구 분야 페이지"
            name: "research-area"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - { label: "큰 제목(한국어)", name: "title_ko", widget: "string", required: false }
              - { label: "큰 제목(영어)", name: "title_en", widget: "string", required: false }
              - { label: "소개 문구(한국어)  ※ 굵게: <strong>글자</strong>, 줄바꿈은 Enter", name: "lead_ko", widget: "text", required: false }
              - { label: "소개 문구(영어)", name: "lead_en", widget: "text", required: false }
              - { label: "이동 경로 표기(한국어)  예: Home / 구성원", name: "crumb_ko", widget: "string", required: false }
              - { label: "이동 경로 표기(영어)", name: "crumb_en", widget: "string", required: false }
          - label: "연구 프로젝트 페이지"
            name: "research-projects"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - { label: "큰 제목(한국어)", name: "title_ko", widget: "string", required: false }
              - { label: "큰 제목(영어)", name: "title_en", widget: "string", required: false }
              - { label: "소개 문구(한국어)  ※ 굵게: <strong>글자</strong>, 줄바꿈은 Enter", name: "lead_ko", widget: "text", required: false }
              - { label: "소개 문구(영어)", name: "lead_en", widget: "text", required: false }
              - { label: "이동 경로 표기(한국어)  예: Home / 구성원", name: "crumb_ko", widget: "string", required: false }
              - { label: "이동 경로 표기(영어)", name: "crumb_en", widget: "string", required: false }
          - label: "연구실 활동 페이지"
            name: "activities"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - { label: "큰 제목(한국어)", name: "title_ko", widget: "string", required: false }
              - { label: "큰 제목(영어)", name: "title_en", widget: "string", required: false }
              - { label: "소개 문구(한국어)  ※ 굵게: <strong>글자</strong>, 줄바꿈은 Enter", name: "lead_ko", widget: "text", required: false }
              - { label: "소개 문구(영어)", name: "lead_en", widget: "text", required: false }
              - { label: "이동 경로 표기(한국어)  예: Home / 구성원", name: "crumb_ko", widget: "string", required: false }
              - { label: "이동 경로 표기(영어)", name: "crumb_en", widget: "string", required: false }
          - label: "연구 성과 페이지"
            name: "publications"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - { label: "큰 제목(한국어)", name: "title_ko", widget: "string", required: false }
              - { label: "큰 제목(영어)", name: "title_en", widget: "string", required: false }
              - { label: "소개 문구(한국어)  ※ 굵게: <strong>글자</strong>, 줄바꿈은 Enter", name: "lead_ko", widget: "text", required: false }
              - { label: "소개 문구(영어)", name: "lead_en", widget: "text", required: false }
          - label: "구성원 페이지"
            name: "members"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - { label: "큰 제목(한국어)", name: "title_ko", widget: "string", required: false }
              - { label: "큰 제목(영어)", name: "title_en", widget: "string", required: false }
              - { label: "소개 문구(한국어)  ※ 굵게: <strong>글자</strong>, 줄바꿈은 Enter", name: "lead_ko", widget: "text", required: false }
              - { label: "소개 문구(영어)", name: "lead_en", widget: "text", required: false }
              - { label: "이동 경로 표기(한국어)  예: Home / 구성원", name: "crumb_ko", widget: "string", required: false }
              - { label: "이동 경로 표기(영어)", name: "crumb_en", widget: "string", required: false }
          - label: "연구실 장비 페이지"
            name: "equipment"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - { label: "큰 제목(한국어)", name: "title_ko", widget: "string", required: false }
              - { label: "큰 제목(영어)", name: "title_en", widget: "string", required: false }
              - { label: "소개 문구(한국어)  ※ 굵게: <strong>글자</strong>, 줄바꿈은 Enter", name: "lead_ko", widget: "text", required: false }
              - { label: "소개 문구(영어)", name: "lead_en", widget: "text", required: false }
              - { label: "이동 경로 표기(한국어)  예: Home / 구성원", name: "crumb_ko", widget: "string", required: false }
              - { label: "이동 경로 표기(영어)", name: "crumb_en", widget: "string", required: false }
          - label: "Contact 페이지"
            name: "contact"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - { label: "큰 제목(한국어)", name: "title_ko", widget: "string", required: false }
              - { label: "큰 제목(영어)", name: "title_en", widget: "string", required: false }
              - { label: "소개 문구(한국어)  ※ 굵게: <strong>글자</strong>, 줄바꿈은 Enter", name: "lead_ko", widget: "text", required: false }
              - { label: "소개 문구(영어)", name: "lead_en", widget: "text", required: false }
              - { label: "이동 경로 표기(한국어)  예: Home / 구성원", name: "crumb_ko", widget: "string", required: false }
              - { label: "이동 경로 표기(영어)", name: "crumb_en", widget: "string", required: false }

      # ---------------- Projects ----------------
      - name: "projects"
        label: "연구 프로젝트 (Projects)"
        file: "data/projects.json"
        fields:
          - { label: "메모", name: "_comment", widget: "hidden", required: false }
          - label: "프로젝트 목록"
            name: "items"
            widget: "list"
            summary: "{{fields.title_ko}}"
            fields:
              - { label: "고유 ID (영문·하이픈, 주소에 사용. 예: co2-experiment)", name: "id", widget: "string" }
              - { label: "진행 여부", name: "status", widget: "select", options: ["진행 예정", "진행 중", "종료"], default: "진행 중" }
              - { label: "제목(한국어)", name: "title_ko", widget: "string" }
              - { label: "제목(영어)", name: "title_en", widget: "string" }
              - { label: "키워드 (쉼표로 추가)", name: "keywords", widget: "list", required: false }
              - { label: "요약 문장(한국어)", name: "lead_ko", widget: "text" }
              - { label: "요약 문장(영어)", name: "lead_en", widget: "text" }
              - { label: "연구 배경(한국어)", name: "bg_ko", widget: "text" }
              - { label: "연구 배경(영어)", name: "bg_en", widget: "text" }
              - label: "연구 내용 (최대 4개)"
                name: "sections"
                widget: "list"
                max: 4
                summary: "{{fields.title_ko}}"
                fields:
                  - { label: "소제목(한국어)", name: "title_ko", widget: "string" }
                  - { label: "소제목(영어)", name: "title_en", widget: "string" }
                  - label: "세부 항목"
                    name: "bullets"
                    widget: "list"
                    fields:
                      - { label: "내용(한국어)", name: "ko", widget: "string" }
                      - { label: "내용(영어)", name: "en", widget: "string" }
              - { label: "주요 결과 설명(한국어, 선택)", name: "results_ko", widget: "text", required: false }
              - { label: "주요 결과 설명(영어, 선택)", name: "results_en", widget: "text", required: false }
              - label: "결과 이미지 (최대 4장)"
                name: "figures"
                widget: "list"
                max: 4
                required: false
                summary: "{{fields.cap_ko}}"
                fields:
                  - { label: "이미지", name: "image", widget: "image" }
                  - { label: "설명(한국어)", name: "cap_ko", widget: "string", required: false }
                  - { label: "설명(영어)", name: "cap_en", widget: "string", required: false }
              - label: "목록 카드 표시 설정"
                name: "card"
                widget: "object"
                fields:
                  - { label: "카드 이미지", name: "image", widget: "image", required: false }
                  - { label: "상단 분류 문구 (예: EXPERIMENT · AI)", name: "chip", widget: "string", required: false }
                  - { label: "카드 설명(한국어)", name: "desc_ko", widget: "text", required: false }
                  - { label: "카드 설명(영어)", name: "desc_en", widget: "text", required: false }
                  - { label: "하단 태그 (예: Machine Learning)", name: "tag", widget: "string", required: false }

      # ---------------- About ----------------
      - name: "about"
        label: "연구실 소개 (What we do·교과목·협력기관)"
        file: "data/about.json"
        fields:
          - { label: "메모", name: "_comment", widget: "hidden", required: false }
          - label: "What we do (3개 권장)"
            name: "whatwedo"
            widget: "list"
            max: 3
            summary: "{{fields.title_ko}}"
            fields:
              - { label: "제목(한국어)", name: "title_ko", widget: "string" }
              - { label: "제목(영어)", name: "title_en", widget: "string" }
              - { label: "설명(한국어)", name: "desc_ko", widget: "text" }
              - { label: "설명(영어)", name: "desc_en", widget: "text" }
              - { label: "사진 (비우면 자리 표시)", name: "image", widget: "image", required: false }
          - label: "교과목"
            name: "courses"
            widget: "list"
            summary: "{{fields.name_ko}} ({{fields.term}})"
            fields:
              - { label: "교과목명(한국어)", name: "name_ko", widget: "string" }
              - { label: "교과목명(영어)", name: "name_en", widget: "string" }
              - { label: "학년-학기 (예: 3-1)", name: "term", widget: "string" }
          - label: "대학원 교과목"
            name: "grad_courses"
            widget: "list"
            summary: "{{fields.name_ko}} ({{fields.term}})"
            fields:
              - { label: "교과목명(한국어)", name: "name_ko", widget: "string" }
              - { label: "교과목명(영어)", name: "name_en", widget: "string" }
              - { label: "개설 학기 (예: 1학기)", name: "term", widget: "string" }
          - label: "협력 기관"
            name: "partners"
            widget: "list"
            summary: "{{fields.name_ko}}"
            fields:
              - { label: "기관명(한국어)", name: "name_ko", widget: "string" }
              - { label: "기관명(영어)", name: "name_en", widget: "string" }
              - { label: "강조 표시(공공·주요기관 색상)", name: "highlight", widget: "boolean", default: false }
      # ---------------- Publications ----------------
      - name: "publications"
        label: "연구 실적 (Publications)"
        file: "data/publications.json"
        fields:
          - { label: "메모", name: "_comment", widget: "hidden", required: false }
          - label: "저널 논문 (Paper)"
            name: "papers"
            widget: "list"
            add_to_top: true
            summary: "{{fields.year}} — {{fields.title_en}}"
            fields:
              - { label: "SCI 구분", name: "sci", widget: "select", options: ["SCI", "Non-SCI"], default: "SCI" }
              - { label: "분급 (비SCI는 비워두기)", name: "quartile", widget: "select", options: ["Q1", "Q2", "Q3", "Q4"], required: false }
              - { label: "연도", name: "year", widget: "string" }
              - { label: "DOI", name: "doi", widget: "string", required: false }
              - { label: "논문 제목(한국어) — 국문지 논문은 국문 제목, 영문지는 영문 제목을 그대로 입력", name: "title_ko", widget: "string" }
              - { label: "논문 제목(영어)", name: "title_en", widget: "string" }
              - { label: "저자 (로마자, 예: G.W. Ju, Y.S. Lee)", name: "authors", widget: "string" }
              - { label: "저자(한국어, 예: 주관우, 이영수 — 비우면 로마자 표기가 표시됩니다)", name: "authors_ko", widget: "string", required: false }
              - { label: "저널명(한국어) — 국문지는 국문 학회지명, 영문지는 영문지명 그대로", name: "journal_ko", widget: "string" }
              - { label: "저널명(영어)", name: "journal_en", widget: "string" }
              - { label: "저널 링크 URL (선택) — 논문 원문/저널 페이지 주소", name: "url", widget: "string", required: false }
          - label: "학술대회 발표 (Presentation)"
            name: "presentations"
            widget: "list"
            add_to_top: true
            summary: "{{fields.date}} — {{fields.title_en}}"
            fields:
              - { label: "발표 시기 (예: May 2026)", name: "date", widget: "string" }
              - { label: "발표 제목(한국어) — 국내 학회 국문 발표는 국문 제목", name: "title_ko", widget: "string" }
              - { label: "발표 제목(영어)", name: "title_en", widget: "string" }
              - { label: "저자 (로마자, 예: G.W. Ju, Y.S. Lee)", name: "authors", widget: "string" }
              - { label: "저자(한국어, 예: 주관우, 이영수 — 비우면 로마자 표기가 표시됩니다)", name: "authors_ko", widget: "string", required: false }
              - { label: "학술대회명(한국어, 예: 한국자원공학회 춘계학술대회)", name: "venue_ko", widget: "string" }
              - { label: "학술대회명(영어, 예: KSMER Spring Conference)", name: "venue_en", widget: "string" }

          - label: "수상 (Awards)"
            name: "awards"
            widget: "list"
            add_to_top: true
            summary: "{{fields.date}} — {{fields.name_ko}}"
            fields:
              - { label: "수상 시기 (예: 2026.05)", name: "date", widget: "string" }
              - { label: "상 이름(한국어)", name: "name_ko", widget: "string" }
              - { label: "상 이름(영어)", name: "name_en", widget: "string" }
              - { label: "수상자 (로마자, 예: G.W. Ju)", name: "recipient", widget: "string" }
              - { label: "수상자(한국어, 예: 주관우 — 비우면 로마자 표기가 표시됩니다)", name: "recipient_ko", widget: "string", required: false }
              - { label: "수여기관(한국어)", name: "org_ko", widget: "string" }
              - { label: "수여기관(영어)", name: "org_en", widget: "string" }

      # ---------------- Activities ----------------
      - name: "activities"
        label: "연구실 활동 (Activities)"
        file: "data/activities.json"
        fields:
          - { label: "메모", name: "_comment", widget: "hidden", required: false }
          - label: "활동 게시물 (홈에는 최신 3개 표시)"
            name: "items"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title_ko}}"
            fields:
              - { label: "날짜 (YYYY-MM-DD)", name: "date", widget: "string" }
              - { label: "분류", name: "category", widget: "select", options: ["교육", "워크샵", "기타"], default: "기타" }
              - { label: "제목(한국어)", name: "title_ko", widget: "string" }
              - { label: "제목(영어)", name: "title_en", widget: "string" }
              - { label: "내용(한국어) — 굵게: <strong>글자</strong>, 줄바꿈은 Enter", name: "body_ko", widget: "text" }
              - { label: "내용(영어)", name: "body_en", widget: "text" }
              - label: "사진 (최대 3장, 상세 화면에 표시)"
                name: "images"
                widget: "list"
                max: 3
                required: false
                summary: "{{fields.caption_ko}}"
                fields:
                  - { label: "사진", name: "image", widget: "image" }
                  - { label: "설명(한국어, 선택)", name: "caption_ko", widget: "string", required: false }
                  - { label: "설명(영어, 선택)", name: "caption_en", widget: "string", required: false }

      # ---------------- Schedule ----------------
      - name: "schedule"
        label: "연구실 일정 (Schedule)"
        file: "data/schedule.json"
        fields:
          - { label: "메모", name: "_comment", widget: "hidden", required: false }
          - label: "일정 목록 (달력·다가오는 일정에 자동 표시)"
            name: "events"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title_ko}}"
            fields:
              - { label: "날짜 (YYYY-MM-DD)", name: "date", widget: "string" }
              - { label: "일정명(한국어)", name: "title_ko", widget: "string" }
              - { label: "일정명(영어)", name: "title_en", widget: "string" }

      # ---------------- Grants ----------------
      - name: "grants"
        label: "연구 과제 (Grants)"
        file: "data/grants.json"
        fields:
          - { label: "메모", name: "_comment", widget: "hidden", required: false }
          - label: "과제 목록"
            name: "items"
            widget: "list"
            summary: "{{fields.start_year}}.{{fields.start_month}} — {{fields.title_ko}}"
            fields:
              - { label: "과제명(한국어)", name: "title_ko", widget: "string" }
              - { label: "과제명(영어)", name: "title_en", widget: "string" }
              - { label: "지원기관(한국어)", name: "agency_ko", widget: "string" }
              - { label: "지원기관(영어)", name: "agency_en", widget: "string" }
              - { label: "시작 연도", name: "start_year", widget: "select", options: ["2000", "2001", "2002", "2003", "2004", "2005", "2006", "2007", "2008", "2009", "2010", "2011", "2012", "2013", "2014", "2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027", "2028", "2029", "2030", "2031", "2032", "2033", "2034", "2035", "2036", "2037", "2038", "2039", "2040", "2041", "2042", "2043", "2044", "2045", "2046", "2047", "2048", "2049", "2050", "2051", "2052", "2053", "2054", "2055", "2056", "2057", "2058", "2059", "2060", "2061", "2062", "2063", "2064", "2065", "2066", "2067", "2068", "2069", "2070", "2071", "2072", "2073", "2074", "2075", "2076", "2077", "2078", "2079", "2080", "2081", "2082", "2083", "2084", "2085", "2086", "2087", "2088", "2089", "2090", "2091", "2092", "2093", "2094", "2095", "2096", "2097", "2098", "2099"] }
              - { label: "시작 월", name: "start_month", widget: "select", options: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"] }
              - { label: "종료 연도 (미정 가능)", name: "end_year", widget: "select", options: ["미정", "2000", "2001", "2002", "2003", "2004", "2005", "2006", "2007", "2008", "2009", "2010", "2011", "2012", "2013", "2014", "2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027", "2028", "2029", "2030", "2031", "2032", "2033", "2034", "2035", "2036", "2037", "2038", "2039", "2040", "2041", "2042", "2043", "2044", "2045", "2046", "2047", "2048", "2049", "2050", "2051", "2052", "2053", "2054", "2055", "2056", "2057", "2058", "2059", "2060", "2061", "2062", "2063", "2064", "2065", "2066", "2067", "2068", "2069", "2070", "2071", "2072", "2073", "2074", "2075", "2076", "2077", "2078", "2079", "2080", "2081", "2082", "2083", "2084", "2085", "2086", "2087", "2088", "2089", "2090", "2091", "2092", "2093", "2094", "2095", "2096", "2097", "2098", "2099"], default: "미정" }
              - { label: "종료 월 (미정 가능)", name: "end_month", widget: "select", options: ["미정", "01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"], default: "미정" }
              - { label: "상태  ※ '자동'이면 종료 연월을 보고 진행 중/종료가 자동 판정됩니다", name: "status", widget: "select", options: ["자동(기간 기준)", "진행 중", "종료"], default: "자동(기간 기준)" }

      # ---------------- Equipment ----------------
      - name: "equipment"
        label: "연구실 장비 (Equipment)"
        file: "data/equipment.json"
        fields:
          - { label: "메모", name: "_comment", widget: "hidden", required: false }
          - label: "장비 목록"
            name: "items"
            widget: "list"
            summary: "{{fields.name_ko}}"
            fields:
              - { label: "장비명(한국어)", name: "name_ko", widget: "string" }
              - { label: "장비명(영어)", name: "name_en", widget: "string" }
              - { label: "설명(한국어)", name: "desc_ko", widget: "text" }
              - { label: "설명(영어)", name: "desc_en", widget: "text" }
              - { label: "사진 (선택)", name: "image", widget: "image", required: false }

      # ---------------- PI (지도교수 · 연락처) ----------------
      - name: "pi"
        label: "지도교수 · 연락처 (PI)"
        file: "data/pi.json"
        fields:
          - { label: "메모", name: "_comment", widget: "hidden", required: false }
          - { label: "교수님 사진", name: "photo", widget: "image", required: false }
          - { label: "이름(한국어)  예: 이영수 | Youngsoo Lee", name: "name_ko", widget: "string" }
          - { label: "이름(영어)", name: "name_en", widget: "string", required: false }
          - { label: "직함(한국어)  ※ 소개·구성원 페이지에 함께 표시됩니다", name: "title_ko", widget: "string", required: false }
          - { label: "직함(영어, 대문자 권장)", name: "title_en", widget: "string", required: false }
          - { label: "한 줄 연구 소개(한국어)  ※ 구성원 페이지. 굵게: <strong>글자</strong>", name: "intro_ko", widget: "text", required: false }
          - { label: "한 줄 연구 소개(영어)", name: "intro_en", widget: "text", required: false }
          - label: "학력 및 경력 (소개 페이지)"
            name: "career"
            widget: "list"
            required: false
            summary: "{{fields.period_ko}} — {{fields.desc_ko}}"
            fields:
              - { label: "기간(한국어)  예: 2013 – 현재", name: "period_ko", widget: "string" }
              - { label: "기간(영어)  예: 2013 – Present", name: "period_en", widget: "string", required: false }
              - { label: "내용(한국어)", name: "desc_ko", widget: "string" }
              - { label: "내용(영어)", name: "desc_en", widget: "string", required: false }
          - label: "연락처 (소개·구성원·문의 페이지 + 모든 페이지 하단에 함께 반영)"
            name: "contact"
            widget: "object"
            collapsed: true
            fields:
              - { label: "주소(한국어) — 문의 페이지용, 건물명 포함", name: "address_ko", widget: "string", required: false }
              - { label: "주소(영어) — 문의 페이지용", name: "address_en", widget: "string", required: false }
              - { label: "주소 짧게(한국어) — 페이지 하단용", name: "address_short_ko", widget: "string", required: false }
              - { label: "주소 짧게(영어) — 페이지 하단용", name: "address_short_en", widget: "string", required: false }
              - { label: "교수 연구실(한국어)", name: "pi_office_ko", widget: "string", required: false }
              - { label: "교수 연구실(영어)", name: "pi_office_en", widget: "string", required: false }
              - { label: "학생 연구실(한국어)", name: "lab_office_ko", widget: "string", required: false }
              - { label: "학생 연구실(영어)", name: "lab_office_en", widget: "string", required: false }
              - { label: "호실 한 줄 표기(한국어) — 페이지 하단용", name: "rooms_ko", widget: "string", required: false }
              - { label: "호실 한 줄 표기(영어) — 페이지 하단용", name: "rooms_en", widget: "string", required: false }
              - { label: "대표 전화", name: "phone", widget: "string", required: false }
              - { label: "대표 이메일", name: "email", widget: "string", required: false }
              - { label: "이메일 옆 표기(한국어)  예: (이영수 교수)", name: "email_note_ko", widget: "string", required: false }
              - { label: "이메일 옆 표기(영어)", name: "email_note_en", widget: "string", required: false }
              - { label: "대표 학생(한국어)", name: "rep_ko", widget: "string", required: false }
              - { label: "대표 학생(영어)", name: "rep_en", widget: "string", required: false }
              - { label: "대표 학생 이메일", name: "rep_email", widget: "string", required: false }

      # ---------------- Members ----------------
      - name: "members"
        label: "구성원 (Members)"
        file: "data/members.json"
        fields:
          - { label: "메모", name: "_comment", widget: "hidden", required: false }
          - label: "구성원 카드"
            name: "members"
            widget: "list"
            summary: "{{fields.name_ko}} ({{fields.role_ko}})"
            fields:
              - { label: "아바타 글자 (이름 첫 글자)", name: "initial", widget: "string" }
              - { label: "사진 (선택 — 없으면 아바타 글자 표시)", name: "photo", widget: "image", required: false }
              - { label: "이름(한국어)", name: "name_ko", widget: "string" }
              - { label: "이름(영어)", name: "name_en", widget: "string" }
              - { label: "직책(한국어)", name: "role_ko", widget: "string" }
              - { label: "직책(영어)", name: "role_en", widget: "string" }
              - { label: "비고(한국어, 예: 2025년 합류 — 줄바꿈 가능)", name: "note_ko", widget: "text", required: false }
              - { label: "비고(영어)", name: "note_en", widget: "text", required: false }
              - { label: "이메일 (선택)", name: "email", widget: "string", required: false }
              - { label: "LinkedIn 주소 (예: https://www.linkedin.com/in/아이디)", name: "linkedin", widget: "string", required: false }
              - { label: "LinkedIn 버튼 노출", name: "show_linkedin", widget: "boolean", default: false, required: false }
              - { label: "CV 파일 (PDF 업로드)", name: "cv", widget: "file", required: false }
              - { label: "CV 버튼 노출", name: "show_cv", widget: "boolean", default: false, required: false }
          - label: "진출 분야 (구성원 페이지 하단 배지)"
            name: "careers"
            widget: "list"
            summary: "{{fields.name_ko}} ({{fields.sector}})"
            fields:
              - { label: "기관·기업명(한국어)", name: "name_ko", widget: "string" }
              - { label: "기관·기업명(영어)", name: "name_en", widget: "string" }
              - { label: "구분", name: "sector", widget: "select", options: ["공공", "산업체"], default: "산업체" }
          - label: "졸업생 진로표 (Alumni)"
            name: "alumni"
            widget: "list"
            summary: "{{fields.org_ko}} — {{fields.role_ko}}"
            fields:
              - { label: "소속(한국어)", name: "org_ko", widget: "string" }
              - { label: "소속(영어)", name: "org_en", widget: "string" }
              - { label: "분야(한국어)", name: "role_ko", widget: "string" }
              - { label: "분야(영어)", name: "role_en", widget: "string" }
              - { label: "학위(한국어)", name: "degree_ko", widget: "string" }
              - { label: "학위(영어)", name: "degree_en", widget: "string" }
