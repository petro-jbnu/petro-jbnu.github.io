- name: careers
  label: 진출 기관
  label_singular: 기관
  icon: domain
  file: content/careers.json
  identifier_field: name_ko
  summary: "{{name_ko}} · {{sector}}"
  description: 연구실 소개 페이지의 진출 분야에 구분(공공·산업체·국제)별로 표시됩니다. 목록 순서가 사이트 표시 순서입니다. 순서를 바꾸려면 목록에서 끌어서 옮기세요.
  fields:
  - label: 기관·기업명(한국어)
    name: name_ko
    widget: string
  - label: 기관·기업명(영어)
    name: name_en
    widget: string
    required: false
  - label: 구분
    name: sector
    widget: select
    options:
    - 공공
    - 산업체
    - 국제
    default: 산업체
    hint: 공공 = 공기업·정부출연연구원, 산업체 = 국내외 산업체, 국제 = 국제 협력기관
  - label: 연구 협력 기관 (녹색 표식)
    name: partner
    widget: boolean
    default: false
    required: false
